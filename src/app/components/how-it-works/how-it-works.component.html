<section id="how-it-works" class="section section--white" aria-labelledby="how-title">
  <div class="container">
    <div class="section-header" appReveal>
      <p class="eyebrow"><app-icon name="paw" [size]="16" /> How It Works</p>
      <h2 id="how-title">Booking Is Simple</h2>
      <p>Three easy steps to a happy, relaxed stay for your dog.</p>
    </div>

    <ol class="steps">
      @for (step of steps; track step.title; let i = $index) {
        <li class="step" appReveal [style.transition-delay.ms]="i * 120">
          <div class="step__marker">
            <span class="step__icon"><app-icon [name]="step.icon" [size]="30" /></span>
            <span class="step__num" aria-hidden="true">{{ i + 1 }}</span>
          </div>
          <h3><span class="sr-only">Step {{ i + 1 }}: </span>{{ step.title }}</h3>
          <p>{{ step.text }}</p>
        </li>
      }
    </ol>

    <div class="steps__cta" appReveal>
      <a href="#booking" class="btn btn--primary">
        <app-icon name="calendar" [size]="18" />
        Start Your Enquiry
      </a>
    </div>
  </div>
</section>
