<section id="why-us" class="section section--beige" aria-labelledby="why-title">
  <div class="container">
    <div class="section-header" appReveal>
      <p class="eyebrow"><app-icon name="shield-check" [size]="16" /> Why Choose Us?</p>
      <h2 id="why-title">Why Pet Parents Trust Us</h2>
      <p>Home-based dog boarding in Hyderabad that feels like family — because it is.</p>
    </div>

    <ul class="why__grid">
      @for (item of features; track item.title; let i = $index) {
        <li class="why__card card card--hover" appReveal [style.transition-delay.ms]="(i % 3) * 80">
          <span class="why__number" aria-hidden="true">{{ (i + 1).toString().padStart(2, '0') }}</span>
          <span class="icon-badge"><app-icon [name]="item.icon" [size]="26" /></span>
          <h3>{{ item.title }}</h3>
          <p>{{ item.text }}</p>
        </li>
      }
    </ul>
  </div>
</section>
