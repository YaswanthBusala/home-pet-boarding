<header class="navbar" [class.navbar--scrolled]="scrolled()" [class.navbar--open]="menuOpen()">
  <nav class="container navbar__inner" aria-label="Main navigation">
    <a class="brand" href="#home" (click)="closeMenu()">
      <span class="brand__mark"><app-icon name="paw" [size]="22" /></span>
      <span class="brand__text">
        <span class="brand__name">Home Pet Boarding</span>
        <span class="brand__sub">Center &amp; Day Care</span>
      </span>
      <span class="sr-only"> – {{ config.businessName }}, go to top</span>
    </a>

    <button
      #toggleBtn
      type="button"
      class="navbar__toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-menu"
      (click)="toggleMenu()"
    >
      <app-icon [name]="menuOpen() ? 'x' : 'menu'" [size]="26" />
      <span class="sr-only">{{ menuOpen() ? 'Close menu' : 'Open menu' }}</span>
    </button>

    <div id="primary-menu" class="navbar__menu">
      <ul class="navbar__links">
        @for (link of links; track link.id) {
          <li>
            <a
              [href]="'#' + link.id"
              class="navbar__link"
              [class.is-active]="activeId() === link.id"
              [attr.aria-current]="activeId() === link.id ? 'true' : null"
              (click)="closeMenu()"
              >{{ link.label }}</a
            >
          </li>
        }
      </ul>
      <a href="#booking" class="btn btn--primary navbar__cta" (click)="closeMenu()">
        <app-icon name="calendar" [size]="18" />
        Book Now
      </a>
    </div>
  </nav>
</header>
